<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Знижколов</title>
    <meta name="description" content="Стеження за знижками на ігри в Steam, GOG та роздачами Epic Games зі сповіщеннями в Telegram" />
    <meta name="theme-color" content="#0c111d" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/theme-init.js"></script>
  </head>
  <body>
    <div class="demo-banner" id="demo-banner" hidden>
      Демо-режим: ціни тестові й випадково змінюються при кожній перевірці
    </div>

    <header class="topbar">
      <a class="brand" href="#/" aria-label="Знижколов, на головну">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path
            d="M3.5 6A2.5 2.5 0 0 1 6 3.5h9.3a2.5 2.5 0 0 1 1.77.73l11 11a2.5 2.5 0 0 1 0 3.54l-9.3 9.3a2.5 2.5 0 0 1-3.54 0l-11-11a2.5 2.5 0 0 1-.73-1.77Z"
            class="brand-tag"
          />
          <circle cx="9.5" cy="9.5" r="2.2" class="brand-hole" />
          <circle cx="15.2" cy="16" r="1.6" class="brand-sign" />
          <circle cx="21" cy="21.8" r="1.6" class="brand-sign" />
          <path d="M14.4 22.6 21.8 15.2" class="brand-slash" />
        </svg>
        <span class="brand-name">Знижколов</span>
      </a>

      <nav class="nav" id="nav" aria-label="Розділи" hidden>
        <a href="#/" data-route="showcase">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5h16M4 9.5c0 1.4 1.1 2.5 2.7 2.5S9.3 10.9 9.3 9.5c0 1.4 1.2 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1.1 2.5 2.6 2.5S20 10.9 20 9.5M5.5 12v8h13v-8M10 20v-4.5h4V20" /></svg>
          <span>Знижки</span>
        </a>
        <a href="#/list" data-route="watch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16l-7-4-7 4z" /></svg>
          <span class="nav-full">Мій список</span><span class="nav-short">Список</span>
        </a>
        <a href="#/search" data-route="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
          <span class="nav-full">Знайти гру</span><span class="nav-short">Пошук</span>
        </a>
        <a href="#/epic" data-route="epic">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="9" width="17" height="11" rx="1.5" /><path d="M12 9v11M3.5 13h17M12 9c-2-4-6-4-6-1.5S10 9 12 9c2 0 6 0 6-1.5S14 5 12 9" /></svg>
          <span class="nav-full">Роздачі Epic</span><span class="nav-short">Epic</span>
        </a>
        <a href="#/notifications" data-route="notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4" /></svg>
          <span>Сповіщення</span>
          <b class="nav-count" id="unread-count" hidden></b>
        </a>
        <a href="#/admin" data-route="admin" id="nav-admin" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6v5.5c0 4.2-3 7.6-7 9-4-1.4-7-4.8-7-9V6z" /></svg>
          <span>Адмін</span>
        </a>
      </nav>

      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Перемкнути світлу або темну тему">
          <svg viewBox="0 0 24 24" class="icon-sun" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg>
          <svg viewBox="0 0 24 24" class="icon-moon" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z" /></svg>
        </button>
        <a href="#/login" class="btn btn-sm" id="nav-guest" hidden>Увійти</a>
        <a href="#/profile" class="avatar" id="nav-profile" data-route="profile" hidden aria-label="Профіль"></a>
      </div>
    </header>

    <main id="view" class="container" tabindex="-1"></main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <dialog class="dialog" id="dialog"></dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
